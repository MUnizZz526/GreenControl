# ==============================================================
# GreenControl - Configuração Spring Boot / JPA / Oracle FIAP
# ==============================================================
spring.application.name=greencontrol

# Conexão com o Banco de Dados Oracle FIAP
# Permite override via variáveis de ambiente DB_URL, DB_USER e DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:RM566527}
spring.datasource.password=${DB_PASSWORD:270806}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de Conexões HikariCP Gerenciado pelo Spring
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# Configurações do Spring Data JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson / Formatação de Datas
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo

# Servidor Tomcat
server.port=8080
